<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Inicio de Sesión - BI</title>

  <script type="text/javascript">
      (function(c,l,a,r,i,t,y){
          c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
          t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
          y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
      })(window, document, "clarity", "script", "vm26qffcvr");
  </script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: url('Fondo_Pantalla.png') no-repeat center center;
      background-size: cover;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.3);
      z-index: -1;
    }

    /* Contenedor principal */
    #app {
      width: 100%;
      height: 100%;
      display: flex;
      position: relative;
    }

    /* ===== LOGIN ===== */
    .login-container {
      background: white;
      width: 360px;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      text-align: center;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      max-width: 90%;
    }

    .lock-icon {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #9c27b0, #673ab7);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .lock-icon svg {
      width: 40px;
      height: 40px;
      fill: white;
    }

    h2 {
      color: #4caf50;
      margin-bottom: 20px;
      font-size: 24px;
      font-weight: 600;
    }

    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-size: 12px;
      color: #666;
    }

    input {
      width: 100%;
      padding: 12px 15px;
      border: none;
      border-radius: 25px;
      background: #f1f1f1;
      font-size: 14px;
      transition: all 0.3s ease;
      outline: none;
    }

    input:focus {
      background: #e9e9e9;
      box-shadow: 0 0 0 2px #bbdefb;
    }

    .remember {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
      justify-content: flex-start;
    }

    .remember label {
      font-size: 12px;
      color: #666;
    }

    .btn-login {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #6a1b9a, #4a148c);
      border: none;
      border-radius: 25px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
    }

    .btn-login:hover {
      background: linear-gradient(135deg, #4a148c, #311b92);
      transform: translateY(-2px);
    }

    .message {
      margin-top: 15px;
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
    }

    .message.error {
      background: #ffebee;
      color: #c62828;
      border: 1px solid #ef9a9a;
      display: block;
    }
    
    .message.success {
      background: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #a5d6a7;
      display: block;
    }

    /* ===== DASHBOARD ===== */
    #dashboard {
      display: none;
      width: 100%;
      height: 100%;
      background: transparent;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 20;
    }

    .sidebar {
      width: 240px;
      background: linear-gradient(180deg, #4a148c, #6a1b9a);
      color: white;
      padding: 20px 0;
      display: flex;
      flex-direction: column;
      box-shadow: 2px 0 10px rgba(0,0,0,0.1);
      height: 100vh;
      position: fixed;
      overflow-y: auto;
      z-index: 100;
      transition: all 0.3s ease;
      left: 0;
      top: 0;
    }

    .sidebar.collapsed {
      width: 0;
      padding: 0;
      overflow: hidden;
      left: -240px;
    }

    .sidebar-tab {
      position: fixed;
      top: 0;
      left: 0;
      width: 40px;
      height: 40px;
      background: linear-gradient(180deg, #4a148c, #6a1b9a);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 20px;
      cursor: pointer;
      z-index: 101;
      box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
      transition: all 0.3s ease;
      border-bottom-right-radius: 8px;
    }

    .sidebar-tab:hover {
      background: linear-gradient(180deg, #6a1b9a, #9c27b0);
    }

    .logo-container {
      padding: 0 20px 20px;
      text-align: center;
      border-bottom: 1px solid rgba(255,255,255,0.2);
    }

    .logo-container img {
      width: 160px;
      height: auto;
    }

    /* === CATEGORÍAS (ACORDEÓN) === */
    .category-header {
      padding: 14px 20px;
      font-size: 15px;
      font-weight: 600;
      color: #e1bee7;
      background: rgba(0,0,0,0.15);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.2s;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .category-header:hover {
      background: rgba(255,255,255,0.2);
    }

    .category-header .arrow {
      transition: transform 0.3s ease;
    }

    .category-header.expanded .arrow {
      transform: rotate(90deg);
    }

    .category-items {
      display: none;
      padding-left: 10px;
    }

    .category.expanded .category-items {
      display: block;
    }

    /* === ÍTEMS DE REPORTE Y BOTÓN DE CIERRE === */
    .menu-item,
    #logoutBtn {
      padding: 12px 20px;
      color: white;
      font-size: 13px;
      cursor: pointer;
      border-left: 4px solid transparent;
      transition: all 0.25s ease;
      margin: 4px 10px;
      border-radius: 0 8px 8px 0;
      text-align: left;
    }

    .menu-item:hover,
    #logoutBtn:hover {
      background: rgba(255,255,255,0.25);
      box-shadow: 0 0 8px rgba(255,255,255,0.15);
      transform: translateX(4px);
    }

    .menu-item.active {
      background: rgba(255,255,255,0.2);
      border-left: 4px solid #ffeb3b;
    }

    /* Estilo especial para Cerrar Sesión */
    #logoutBtn {
      background: rgba(183, 28, 28, 0.3);
      margin-top: 20px;
      border-top: 1px solid rgba(255,255,255,0.1);
      color: #ffcdd2;
      font-weight: bold;
    }

    #logoutBtn:hover {
      background: rgba(183, 28, 28, 0.5);
      color: white;
    }

    .main-content {
      margin-left: 240px;
      width: calc(100% - 240px);
      height: 100vh;
      background: transparent;
      position: relative;
      transition: all 0.3s ease;
    }

    .main-content.fullscreen {
      margin-left: 0;
      width: 100%;
    }

    .powerbi-container {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      position: relative;
    }

    .powerbi-container iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
      transform: scale(1.05);
      transform-origin: top left;
      clip-path: inset(0 0 0 0);
    }

    .sidebar::-webkit-scrollbar {
      width: 6px;
    }
    .sidebar::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.3);
      border-radius: 3px;
    }

    @media (max-width: 768px) {
      .sidebar {
        width: 200px;
      }
      .main-content {
        margin-left: 200px;
        width: calc(100% - 200px);
      }
      .sidebar-tab {
        width: 36px;
        height: 36px;
        font-size: 18px;
      }
      .powerbi-container iframe {
        transform: scale(1.0);
      }
    }
  </style>
</head>
<body>

  <div id="app">
    <!-- === FORMULARIO DE LOGIN (ACTUALIZADO) === -->
    <div id="login" class="login-container">
      <div class="lock-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 12c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3-9H9V9h6v2z"/>
        </svg>
      </div>
      <h2>Inicio de Sesión</h2>
      
      <!-- MODIFICACIÓN CLAVE: method="post" y action="#" para simular envío real -->
      <form id="loginForm" method="post" action="#" autocomplete="on" name="login-form">
        <div class="input-group">
          <label for="username">Usuario *</label>
          <input type="text" id="username" name="username" autocomplete="username" placeholder="Ingresa tu usuario" required />
        </div>
        <div class="input-group">
          <label for="password">Contraseña *</label>
          <!-- autocomplete="current-password" es esencial para que Chrome detecte el campo -->
          <input type="password" id="password" name="current-password" autocomplete="current-password" placeholder="Ingresa tu contraseña" required />
        </div>
        <div class="remember">
          <div>
            <input type="checkbox" id="remember" />
            <label for="remember">Recordarme</label>
          </div>
        </div>
        <button type="submit" class="btn-login">Ingresar</button>
        <div id="loginMessage" class="message"></div>
      </form>
    </div>

    <!-- === DASHBOARD === -->
    <div id="dashboard">
      <div class="sidebar" id="sidebar">
        <div class="logo-container">
          <img src="Logo.png" alt="Logo">
        </div>
        <div class="menu-list" id="menuList">
          <!-- Categorías y botón de cierre se generan aquí -->
        </div>
      </div>

      <div class="sidebar-tab" id="sidebarTab">☰</div>

      <div class="main-content" id="mainContent">
        <div class="powerbi-container">
          <iframe id="powerbi-frame" src="" allowFullScreen="true"></iframe>
        </div>
      </div>
    </div>
  </div>

  <script>
    const userAccess = {
      admin: 'all',
      Claro_BackOffice: ['Plan Aliado','Migra Col'],
      Sanitas: ['Cobranza', 'Retencion', 'Vector'],
      Spinner: ['Spinner'],
      Vtr_Cobranza: ['Cobranza ( Mes Actual)', 'Cobranza ( Mes Anterior)'],
      Vtr_Operaciones: ['360 Migracion', 'Calidad', 'Redes', 'Reagendamiento', 'Scott']
    };

    const passwords = {
      admin: 'admin123*',
      Claro_BackOffice: 'ClaroBO26&',
      Sanitas: 'Sanitas26*.',
      Spinner: 'Spinner+*26', 
      Vtr_Cobranza: 'Cobranza&%26',
      Vtr_Operaciones: 'Operaciones2026*+.'
    };

    const reports = [
      { name: 'Plan Aliado', url: 'https://app.powerbi.com/view?r=eyJrIjoiMjNhZTQ1ODEtMjAwZi00NjU2LTgwNDItNTgzZWI0MzkwYzg0IiwidCI6ImI0MTE2ZGE0LTBlN2QtNGEyNy1hZDI5LTJiY2RiZjM2NGMzNCIsImMiOjR9  ', group: 'Claro BackOffice' },
      { name: 'Migra Col', url: 'https://app.powerbi.com/view?r=eyJrIjoiZDg2NDc4NzItMTRlMi00NWU2LWJkZDgtM2MxYTBlZjUyNjhjIiwidCI6ImI0MTE2ZGE0LTBlN2QtNGEyNy1hZDI5LTJiY2RiZjM2NGMzNCIsImMiOjR9  ', group: 'Claro BackOffice' },
      { name: 'Cobranza', url: 'https://app.powerbi.com/view?r=eyJrIjoiNTJjODU3MGUtNjQ5Yi00NDZmLTljZDEtZTg1ODMwMjUwMmU1IiwidCI6ImI0MTE2ZGE0LTBlN2QtNGEyNy1hZDI5LTJiY2RiZjM2NGMzNCIsImMiOjR9  ', group: 'Sanitas' },
      { name: 'Retencion', url: 'https://app.powerbi.com/view?r=eyJrIjoiODEzZGFmZTktMmJmYS00ODEwLWE0MDMtNjFjZTRiNjFmMzU2IiwidCI6ImI0MTE2ZGE0LTBlN2QtNGEyNy1hZDI5LTJiY2RiZjM2NGMzNCIsImMiOjR9  ', group: 'Sanitas' },
      { name: 'Vector', url: 'https://app.powerbi.com/view?r=eyJrIjoiNDkxYmI2NWYtMDY4Yi00MGNkLTljOGUtNTA5NGU2YjA1NThlIiwidCI6ImI0MTE2ZGE0LTBlN2QtNGEyNy1hZDI5LTJiY2RiZjM2NGMzNCIsImMiOjR9  ', group: 'Sanitas' },
      { name: 'Spinner', url: 'https://app.powerbi.com/view?r=eyJrIjoiNjAxN2UwMmMtZDQ3MC00OGZkLTliYzctYzBiYWEzYTMyZDA4IiwidCI6ImI0MTE2ZGE0LTBlN2QtNGEyNy1hZDI5LTJiY2RiZjM2NGMzNCIsImMiOjR9  ', group: 'Spinner' },
      { name: 'Cobranza ( Mes Actual)', url: 'https://app.powerbi.com/view?r=eyJrIjoiMjQwMDQ5OTEtM2U4MS00ODg4LTkxZWYtZWI4MTQxMjEwZTA2IiwidCI6ImI0MTE2ZGE0LTBlN2QtNGEyNy1hZDI5LTJiY2RiZjM2NGMzNCIsImMiOjR9  ', group: 'VTR Cobranza' },
      { name: 'Cobranza ( Mes Anterior)', url: 'https://app.powerbi.com/view?r=eyJrIjoiYmJlMWI1YTYtNDY2Ni00MGRjLTk2YzMtYWJkMjIxYjIyODJjIiwidCI6ImI0MTE2ZGE0LTBlN2QtNGEyNy1hZDI5LTJiY2RiZjM2NGMzNCIsImMiOjR9  ', group: 'VTR Cobranza' },
      { name: '360 Migracion', url: 'https://app.powerbi.com/view?r=eyJrIjoiNWE4NmEwYjgtNjk1OC00NTAxLThmZGUtYzk1ZjM1OTJkN2Y5IiwidCI6ImI0MTE2ZGE0LTBlN2QtNGEyNy1hZDI5LTJiY2RiZjM2NGMzNCIsImMiOjR9  ', group: 'VTR Operaciones' },
      { name: 'Calidad', url: 'https://app.powerbi.com/view?r=eyJrIjoiMTg5OWRhYWMtNGViYi00YTg1LTg5MDItM2EyMzU0MmM1OGE5IiwidCI6ImI0MTE2ZGE0LTBlN2QtNGEyNy1hZDI5LTJiY2RiZjM2NGMzNCIsImMiOjR9  ', group: 'VTR Operaciones' },
      { name: 'Redes', url: 'https://app.powerbi.com/view?r=eyJrIjoiNDY0YzVjYjktMGY3Zi00MTM3LTg1NDYtYTAyY2EyNTYzNTNmIiwidCI6ImI0MTE2ZGE0LTBlN2QtNGEyNy1hZDI5LTJiY2RiZjM2NGMzNCIsImMiOjR9  ', group: 'VTR Operaciones' },
      { name: 'Reagendamiento', url: 'https://app.powerbi.com/view?r=eyJrIjoiMzE2MjhmNDctMDk3MC00Y2I5LWFmZDAtZmI1ZDczN2FmY2M4IiwidCI6ImI0MTE2ZGE0LTBlN2QtNGEyNy1hZDI5LTJiY2RiZjM2NGMzNCIsImMiOjR9  ', group: 'VTR Operaciones' },
      { name: 'Scott', url: 'https://app.powerbi.com/view?r=eyJrIjoiYjUxOTRhMDctYjIxNC00YzFkLTgyNWEtN2E1OGZiZTk0ZGYwIiwidCI6ImI0MTE2ZGE0LTBlN2QtNGEyNy1hZDI5LTJiY2RiZjM2NGMzNCIsImMiOjR9  ', group: 'VTR Operaciones' }
    ];

    let currentUser = null;
    let visibleReports = [];

    // === LOGIN (ACTUALIZADO PARA GUARDAR CONTRASEÑA) ===
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      // Prevenimos el envío real, pero con un pequeño retraso para que Chrome detecte el "login"
      e.preventDefault();
      
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value.trim();
      const remember = document.getElementById('remember').checked;
      const msg = document.getElementById('loginMessage');

      if (passwords[user] && passwords[user] === pass) {
        currentUser = user;
        msg.textContent = 'Iniciando sesión...';
        msg.className = 'message success';

        // Guardar en localStorage si "Recordarme" está activo
        if (remember) {
          localStorage.setItem('bi_saved_user', user);
          localStorage.setItem('bi_saved_pass', pass); // ⚠️ Solo para demo, no usar en producción
        } else {
          localStorage.removeItem('bi_saved_user');
          localStorage.removeItem('bi_saved_pass');
        }

        if (userAccess[user] === 'all') {
          visibleReports = [...reports];
        } else {
          const allowedNames = userAccess[user];
          visibleReports = reports.filter(r => allowedNames.includes(r.name));
        }

        // Pequeño retraso para permitir que Chrome detecte el envío exitoso
        setTimeout(() => {
          renderSidebar();
          document.getElementById('login').style.display = 'none';
          document.getElementById('dashboard').style.display = 'flex';
        }, 1000); // 1 segundo es suficiente para que el navegador procese
        
      } else {
        msg.textContent = 'Usuario o contraseña incorrectos.';
        msg.className = 'message error';
        
        // Forzar a que el navegador NO guarde credenciales inválidas
        if (document.activeElement) document.activeElement.blur();
      }
    });

    // === CARGAR CREDENCIALES GUARDADAS AL INICIAR ===
    window.addEventListener('load', function() {
      const savedUser = localStorage.getItem('bi_saved_user');
      const savedPass = localStorage.getItem('bi_saved_pass');
      
      if (savedUser && savedPass) {
        document.getElementById('username').value = savedUser;
        document.getElementById('password').value = savedPass;
        document.getElementById('remember').checked = true;
      } else if (savedUser) {
        document.getElementById('username').value = savedUser;
        document.getElementById('remember').checked = true;
        document.getElementById('password').focus();
      }
    });

    // === RENDER SIDEBAR + BOTÓN DE CIERRE ===
    function renderSidebar() {
      const menuList = document.getElementById('menuList');
      menuList.innerHTML = '';

      const groups = {};
      visibleReports.forEach(report => {
        if (!groups[report.group]) groups[report.group] = [];
        groups[report.group].push(report);
      });

      for (const [group, items] of Object.entries(groups)) {
        const categoryDiv = document.createElement('div');
        categoryDiv.className = 'category';

        const header = document.createElement('div');
        header.className = 'category-header';
        header.innerHTML = `
          <span>${group}</span>
          <span class="arrow">▶</span>
        `;

        const itemsContainer = document.createElement('div');
        itemsContainer.className = 'category-items';

        items.forEach(item => {
          const menuItem = document.createElement('div');
          menuItem.className = 'menu-item';
          menuItem.textContent = item.name;
          menuItem.setAttribute('data-url', item.url);
          menuItem.addEventListener('click', handleMenuClick);
          itemsContainer.appendChild(menuItem);
        });

        header.addEventListener('click', () => {
          categoryDiv.classList.toggle('expanded');
        });

        categoryDiv.appendChild(header);
        categoryDiv.appendChild(itemsContainer);
        menuList.appendChild(categoryDiv);
      }

      // === AÑADIR BOTÓN DE CERRAR SESIÓN AL FINAL ===
      const logoutBtn = document.createElement('div');
      logoutBtn.id = 'logoutBtn';
      logoutBtn.textContent = 'Cerrar Sesión';
      logoutBtn.addEventListener('click', function() {
        document.getElementById('powerbi-frame').src = '';
        document.getElementById('dashboard').style.display = 'none';
        document.getElementById('login').style.display = 'block';
        
        // Solo limpiar si NO está marcado "Recordarme"
        if (!document.getElementById('remember').checked) {
          document.getElementById('username').value = '';
          document.getElementById('password').value = '';
        }
        document.getElementById('loginMessage').textContent = '';
        document.getElementById('loginMessage').className = 'message';
      });
      menuList.appendChild(logoutBtn);

      // Activar primer reporte
      const firstItem = menuList.querySelector('.menu-item');
      if (firstItem) {
        firstItem.classList.add('active');
        document.getElementById('powerbi-frame').src = firstItem.getAttribute('data-url');
      }
    }

    function handleMenuClick() {
      document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
      this.classList.add('active');
      document.getElementById('powerbi-frame').src = this.getAttribute('data-url');
    }

    // === TOGGLE SIDEBAR ===
    const sidebar = document.getElementById('sidebar');
    const mainContent = document.getElementById('mainContent');
    const sidebarTab = document.getElementById('sidebarTab');

    sidebarTab.addEventListener('click', function() {
      if (sidebar.classList.contains('collapsed')) {
        sidebar.classList.remove('collapsed');
        mainContent.classList.remove('fullscreen');
      } else {
        sidebar.classList.add('collapsed');
        mainContent.classList.add('fullscreen');
      }
    });
  </script>

</body>
</html>
